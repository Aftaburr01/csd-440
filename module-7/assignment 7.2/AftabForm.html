    Description:      Client-side HTML5 user input form that gathers 7 fields of

                      and boolean) and submits them via POST to AftabResponse.php.
    =============================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSD 440 - Module 7.2: Customer Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 30px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            font-size: 24px;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #334155;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
        }
        .btn-submit {
            background-color: #1e40af;
            color: #ffffff;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CSD 440 Server-Side Scripting</h1>
    <p class="subtitle"><strong>Module 7.2:</strong> Member Registration Form</p>

    <!-- Submission Target points to AftabResponse.php -->
    <form action="AftabResponse.php" method="POST" novalidate>
        <!-- Field 1: String (Text) -->
        <div class="form-group">
            <label for="fullName">1. Full Name (Text):</label>
            <input type="text" id="fullName" name="fullName" placeholder="e.g., Aftabur Rahman">
        </div>

        <!-- Field 2: Email (String/Pattern) -->
        <div class="form-group">
            <label for="email">2. Email Address (Email):</label>
            <input type="email" id="email" name="email" placeholder="e.g., student@bellevue.edu">
        </div>

        <!-- Field 3: Integer (Whole Number) -->
        <div class="form-group">
            <label for="age">3. Age (Integer):</label>
            <input type="number" id="age" name="age" placeholder="e.g., 25" min="1" max="120" step="1">
        </div>

        <!-- Field 4: String (Text) -->
        <div class="form-group">
            <label for="city">4. City of Residence (Text):</label>
            <input type="text" id="city" name="city" placeholder="e.g., Kansas City">
        </div>

        <!-- Field 5: Date (Date Object) -->
        <div class="form-group">
            <label for="registrationDate">5. Registration Date (Date):</label>
            <input type="date" id="registrationDate" name="registrationDate">
        </div>

        <!-- Field 6: Float / Decimal (Currency) -->
        <div class="form-group">
            <label for="accountBalance">6. Opening Balance ($ Float/Decimal):</label>
            <input type="number" id="accountBalance" name="accountBalance" placeholder="e.g., 250.75" step="0.01">
        </div>

        <!-- Field 7: Boolean (Checkbox State) -->
        <div class="form-group checkbox-group">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" value="1">
            <label for="agreeTerms">7. I accept the membership terms and conditions (Boolean flag)</label>
        </div>

        <button type="submit" class="btn-submit">Submit Registration</button>
    </form>
</div>

</body>
</html>
